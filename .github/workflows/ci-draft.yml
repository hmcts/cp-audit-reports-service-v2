name: Build and Publish (Non-Release)

on:
  pull_request:
    branches:
      - master
      - main
      - 'team/**'
  push:
    branches:
      - master
      - main
      - 'team/**'

jobs:
  ci-draft:
    uses: ./.github/workflows/ci-build-publish.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      is_publish: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'team/') && github.event.pull_request.head.repo.full_name == github.repository) }}
      trigger_docker: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
      # The existing input queues the ACR image build, not an AKS deployment.
      trigger_deploy: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'team/') && github.event.pull_request.head.repo.full_name == github.repository) }}
      promote_to_live: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
      source_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
